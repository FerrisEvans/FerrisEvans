name: generate profile cards

on:
  # run automatically every day
  schedule:
    - cron: "30 0 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # regenerate whenever the card configuration changes
  push:
    branches:
    - main
    paths:
    - .github/workflows/profile-cards.yml
    - .github/profile-3d-settings.json

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # the secrets context is not allowed in a step `if`, so it is read here first
      LANGS_PAT: ${{ secrets.LANGS_PAT }}

    steps:
      - uses: actions/checkout@v4

      # streak card, replaces the public streak-stats.demolab.com endpoint
      - name: generate streak.svg
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            {"user": "${{ github.repository_owner }}", "theme": "oceanic-next",
            "hide_border": "true", "timezone": "Asia/Shanghai", "exclude_days": "Sun,Sat",
            "ring": "F06EA9", "background": "0,FFC2E0,FF9ECD", "fire": "FF6FB5",
            "currStreakLabel": "D6338F", "stroke": "AE296C", "currStreakNum": "553844",
            "sideNums": "553844", "sideLabels": "D6338F", "dates": "CA5F82", "excludeDaysLabel": "CA5F82"}
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3D contribution calendar, colors are defined in .github/profile-3d-settings.json
      - name: generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      # profile details and productive time cards: run the same route handlers as
      # github-profile-summary-cards.vercel.app locally, with our own token, so custom colors keep working
      - name: checkout github-profile-summary-cards
        uses: actions/checkout@v4
        with:
          repository: vn7n24fzkq/github-profile-summary-cards
          ref: e722eded97059b31d7e8ad3ae0267b74ff24172d
          path: .summary-cards
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: generate profile summary cards
        working-directory: .summary-cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TS_NODE_TRANSPILE_ONLY: "true"
          PORT: "3000"
          USERNAME: ${{ github.repository_owner }}
        run: |
          npm ci --no-audit --no-fund
          node -r ts-node/register scripts/dev-server.ts > dev-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null "http://localhost:${PORT}/" && break; sleep 2; done
          mkdir -p ../dist/summary
          render() {
            curl -sSf -o "../dist/summary/$1.svg" "http://localhost:${PORT}/api/cards/$1?username=${USERNAME}&mock=0&$2"
            # the handlers answer failures with a 200 error card, keep the previous cards instead
            if grep -q 'ERROR!!!' "../dist/summary/$1.svg"; then
              echo "::error::$1 card could not be generated"; cat dev-server.log; exit 1
            fi
          }
          render profile-details "theme=highcontrast&animation=rgb&name=Ferris&text_color=00ff00&bg_color=001900"
          render productive-time "theme=highcontrast&animation=rgb&utcOffset=8&text_color=00ff00&bg_color=001900"

      # languages of the code this account actually wrote, private org repos included;
      # skipped until LANGS_PAT (classic PAT, repo scope) exists, the other cards still update
      - name: generate own languages card
        if: env.LANGS_PAT != ''
        env:
          GH_TOKEN: ${{ env.LANGS_PAT }}
          GH_USERNAME: ${{ github.repository_owner }}
          # old commit emails that can no longer be verified on the account, kept in a
          # secret so a public repository does not advertise them to scrapers
          EXTRA_EMAILS: ${{ secrets.LANGS_EXTRA_EMAILS }}
          OUT_DIR: dist/langs
        run: python3 .github/scripts/own-languages.py

      - name: collect cards
        run: |
          mkdir -p dist/3d
          cp profile-3d-contrib/*.svg dist/3d/

      # push the content of <build_dir> to a branch, same as the snake workflow
      - name: push cards to the profile-cards branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: profile-cards
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
